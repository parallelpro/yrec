         call locate_opal95_x_stencil(tbl, 1, tbl%fixed_z, hydrogen_fraction, st)'''

[[mutation]]
id = 'opal95-shift-first-x-table'
check = "OPAL95 high-R shift: no empty cell of the stencil's X tables read"
