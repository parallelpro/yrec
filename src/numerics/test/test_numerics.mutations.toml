# Mutations of test_numerics: each check must print FAIL under a mutation of
# the code it covers (numerics/README.md). Run: python3 src/tools/mutate.py
# numerics (src/tools/mutate.py describes this format and the verdicts).
program = "test_numerics"
timeout = 120

[[mutation]]
id = 'cubic_spline-01'
check = 'cspline/splint: clamped spline exact on a cubic'
file = 'numerics/cubic_spline.f90'
old = '*((y(2)-y(1))/(x(2)-x(1))-yp1)'
new = '*((y(2)-y(1))/(x(2)-x(1))+yp1)'

[[mutation]]
id = 'cubic_spline-02'
check = 'splint: its dy exact on the clamped cubic'
file = 'numerics/cubic_spline.f90'
old = '- ((3.0d0*a**2-1.0d0)*y2a(lo)'
new = '- ((3.0d0*a**2-2.0d0)*y2a(lo)'

[[mutation]]
id = 'cubic_spline-03'
check = "compute_spline_coefficients: the power form is splint's"
file = 'numerics/cubic_spline.f90'
old = 'c(4,i) = (y2(i+1) - y2(i))/(6.0d0*h)'
new = 'c(4,i) = (y2(i+1) - y2(i))/(3.0d0*h)'

