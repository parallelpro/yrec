# Mutations of test_eos: each check must print FAIL under a mutation of
# the code it covers (eos/README.md, section 4). Run: python3 src/tools/mutate.py
# eos (src/tools/mutate.py describes this format and the verdicts).
program = "test_eos"
timeout = 300

[[mutation]]
id = 'opal_reread-01'
check = 'OPAL 2006 table: a truncated table returns ierr = 1 on first use, its unit closed'
file = 'eos/opal/opal_table_reader.f90'
old = '''      opal_shared%table_loaded_flag(vintage) = 0
      opal_shared%readco_init_flag(vintage) = 0'''
new = '''      opal_shared%readco_init_flag(vintage) = 0'''

[[mutation]]
id = 'fermi_reader-01'
check = 'Fermi table: a card out of its place, or abscissae wider than the lookup, returns ierr = 1'
file = 'eos/yale/fermi_table_reader.f90'
old = '''         if (misplaced_card) exit'''
new = '''         misplaced_card = .false.'''

[[mutation]]
id = 'fermi_reader-02'
check = 'Fermi table: a card out of its place, or abscissae wider than the lookup, returns ierr = 1'
file = 'eos/yale/fermi_table_reader.f90'
old = '''            if (bin_end > fermi_n_bins) then'''
new = '''            if (bin_end > 2*fermi_n_bins) then'''

[[mutation]]
id = 'cutoff_range-01'
check = 'settings: a Saha cutoff below log T 5.7 returns ierr = 1, and 5.7 is installed'
file = 'eos/eos_lib.f90'
old = '''      if (.not. settings%saha_log10t_cutoff - saha_ramp_width >= fermi_log10t_min) then'''
new = '''      if (.not. settings%saha_log10t_cutoff >= fermi_log10t_min) then'''

[[mutation]]
id = 'fully_ionized_convergence-01'
check = 'fully ionized gas: a density iteration that does not converge returns ierr = 1'
file = 'eos/yale/yale_eos.f90'
old = '''      if (.not. converged) then
         ierr = 1
         return
      end if'''
new = '''      if (.not. converged) then
         return
      end if'''

[[mutation]]
id = 'fermi_range-01'
check = 'fully ionized gas: a point beyond the Fermi-Dirac table is reported, one inside it not'
file = 'eos/yale/yale_eos.f90'
old = '''      extrapolated = log10_temperature < fermi_log10t_min .or. log10_temperature > fermi_log10t_max &'''
new = '''      extrapolated = log10_temperature < fermi_log10t_min .or. log10_temperature > 2*fermi_log10t_max &'''

[[mutation]]
id = 'fermi_range-02'
check = 'fully ionized gas: a point beyond the Fermi-Dirac table is reported, one inside it not'
file = 'eos/yale/yale_eos.f90'
old = '''           .or. abscissa < yale%fermi_table_x_grid(1) .or. abscissa > yale%fermi_table_x_grid(fermi_n_x)'''
new = '''           .or. abscissa < yale%fermi_table_x_grid(1)'''

[[mutation]]
id = 'fermi_range-03'
check = 'fully ionized gas: a point beyond the Fermi-Dirac table is reported, one inside it not'
file = 'eos/eos_messages.f90'
old = '''      if (warned(id)) return
      warned(id) = .true.'''
new = '''      if (warned(id)) return'''

[[mutation]]
id = 'scv_reader-01'
check = "SCV reader: a He or Z table on another grid than the H table's returns ierr = 1"
file = 'eos/scv/scv_table_reader.f90'
old = '''         off_grid = first_off_grid(copy_log10_t /= tlogx(t_idx) .or. copy_npts /= nptsx(t_idx))'''
new = '''         off_grid = 0'''

[[mutation]]
id = 'scv_reader-02'
check = "SCV reader: a He or Z table on another grid than the H table's returns ierr = 1"
file = 'eos/scv/scv_table_reader.f90'
old = '''              tablex(t_idx,1:nptsx(t_idx),iscv_log10_p)), any(tablez(t_idx,1:nptsx(t_idx),iscv_log10_p) /= &'''
new = '''              tablex(t_idx,1:nptsx(t_idx),iscv_log10_p)), .false. .and. any(tablez(t_idx,1:nptsx(t_idx),iscv_log10_p) /= &'''

[[mutation]]
id = 'opal95_reader-01'
check = 'OPAL 1995 table: a zero T6 returns ierr = 1 on first use'
file = 'eos/opal/opal_table_reader.f90'
old = '''         if (v%t6_list(1,t6_scan_idx) == 0.0d0) then'''
new = '''         if (v%t6_list(1,t6_scan_idx) == -1.0d0) then'''

[[mutation]]
id = 'scv_search-01'
check = "SCV: a lookup's cell does not depend on where its search starts"
file = 'eos/scv/scv_eos.f90'
old = '''         idp = max(1, min(nptsx(idtt)-3, jj))'''
new = '''         idp = min(nptsx(idtt)-3, jj)'''

[[mutation]]
id = 'opal_x_quadratic-01'
check = 'OPAL 2006: an entry only the second X quadratic reads, past 1e20 there, is named; ierr = 1'
file = 'eos/opal/opal_eos.f90'
old = '''            if (abs(v%x_interp_result_alt(t6_scan_idx,density_scan_idx)) > opal_x_interp_overflow) then'''
new = '''            if (abs(v%x_interp_result(t6_scan_idx,density_scan_idx)) > opal_x_interp_overflow) then'''

[[mutation]]
id = 'opal_x_quadratic-02'
check = 'OPAL 2006: a huge entry the second X quadratic weights by -1/8 is named; ierr = 1 (M292)'
file = 'eos/opal/opal_eos.f90'
old = '''            if (abs(v%x_interp_result_alt(t6_scan_idx,density_scan_idx)) > opal_x_interp_overflow) then'''
new = '''            if (v%x_interp_result_alt(t6_scan_idx,density_scan_idx) > opal_x_interp_overflow) then'''

[[mutation]]
id = 'opal_x_quadratic-03'
check = 'OPAL 2006: a huge entry the first X quadratic weights by -1/8 is named; ierr = 1 (M292)'
file = 'eos/opal/opal_eos.f90'
old = '''                 v%x_grid_copy(x_index_3))
            if (abs(v%x_interp_result(t6_scan_idx,density_scan_idx)) > opal_x_interp_overflow) then'''
new = '''                 v%x_grid_copy(x_index_3))
            if (v%x_interp_result(t6_scan_idx,density_scan_idx) > opal_x_interp_overflow) then'''

[[mutation]]
id = 'opal_x_quadratic-04'
check = 'OPAL 2006: a huge negative entry read alone (X = 0) is named; ierr = 1 (M292)'
file = 'eos/opal/opal_eos.f90'
old = '''               if (abs(v%x_interp_result(t6_scan_idx,density_scan_idx)) > opal_x_interp_overflow) then'''
new = '''               if (v%x_interp_result(t6_scan_idx,density_scan_idx) > opal_x_interp_overflow) then'''

[[mutation]]
id = 'debye_huckel-01'
check = 'Debye-Hueckel: the two rises of rho are in the ratio of the charge-weighted factor'
file = 'eos/yale/yale_eos.f90'
old = '''            almix = almix + debye_huckel_nu(ii)*dh%metals(ii)'''
new = '''            almix = almix + 6.0d0*dh%metals(ii)'''

[[mutation]]
id = 'source_list-01'
check = 'table sources: SCV, OPAL and MHD listed, each with its stage, switch and procedures'
file = 'eos/scv/scv_eos.f90'
old = '''      src%stage = stage_in_place_of_saha'''
new = '''      src%stage = stage_in_place_of_saha + 1'''

[[mutation]]
id = 'source_list-02'
check = 'table sources: SCV, OPAL and MHD listed, each with its stage, switch and procedures'
file = 'eos/mhd/mhd_eos.f90'
old = '''      src%edge_weight => whole_weight_inside
      src%adopt => adopt_whole_result
      src%blend => blend_table_result
end function mhd_table_source'''
new = '''      src%edge_weight => whole_weight_inside
      src%adopt => adopt_whole_result
end function mhd_table_source'''

[[mutation]]
id = 'source_list-03'
check = "continuity: where the OPAL 2006 edge ramp reaches OPAL"
file = 'eos/blended_eos.f90'
old = '''      if (.not. near_edge) then
         call src%adopt(table_r, r)'''
new = '''      if (.true.) then
         call src%adopt(table_r, r)'''

# ---- the checks that came before this round's (one mutation each) ----

[[mutation]]
id = 'scv_general-01'
check = "SCV general path: before the envelope table is built, SCV's result, as after"
file = 'eos/scv/scv_eos.f90'
old = '''      ierr = 0
      if (abs(hydrogen_fraction-tablenv_hydrogen_fraction) > scv_composition_tolerance &'''
new = '''      ierr = 0
      covers = .false.
      if (tablenv_hydrogen_fraction < 0.0d0) return
      if (abs(hydrogen_fraction-tablenv_hydrogen_fraction) > scv_composition_tolerance &'''

[[mutation]]
