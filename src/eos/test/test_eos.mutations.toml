check = "derivatives: the numerical second derivatives, against finite differences (1e-4)"
file = 'eos/blended_eos.f90'
old = '''         r%dlnrho_dlnt_dt = (above(1) - below(1))/dtl2/ln10'''
new = '''         r%dlnrho_dlnt_dt = (above(1) - below(1))/dtl2/ln10*1.01d0'''

[[mutation]]
