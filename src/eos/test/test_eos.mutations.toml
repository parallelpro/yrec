check = "derivatives: the Saha solution's first and second, against finite differences"
file = 'eos/yale/yale_eos.f90'
old = '''      r%dlnrho_dlnt = -1.0d0 - r%beta14 - s%ep1*d%sqet'''
new = '''      r%dlnrho_dlnt = (-1.0d0 - r%beta14 - s%ep1*d%sqet)*1.01d0'''

[[mutation]]
id = 'derivatives-02'
check = "derivatives: the fully ionized gas's first (1e-3) and second (0.1)"
file = 'eos/yale/yale_eos.f90'
old = '''      r%dlnrho_dlnt = -f%qpt*r%dlnrho_dlnp'''
new = '''      r%dlnrho_dlnt = -1.01d0*f%qpt*r%dlnrho_dlnp'''

[[mutation]]
id = 'derivatives-03'
check = "derivatives: OPAL 2006's first, against finite differences (3e-3)"
file = 'eos/opal_eos_tables.f90'
old = '''                n_vars=9, i_p=1, i_e=2, i_s=3, i_dedrho=4, i_cv=5, i_chi_rho=6, i_chi_t=7, &'''
new = '''                n_vars=9, i_p=1, i_e=2, i_s=3, i_dedrho=4, i_cv=5, i_chi_rho=6, i_chi_t=6, &'''

[[mutation]]
id = 'derivatives-04'
check = "derivatives: OPAL 1995's first, against finite differences (1e-2)"
file = 'eos/opal_eos_tables.f90'
old = '''                n_vars=10, i_p=1, i_e=2, i_s=3, i_dedrho=4, i_cv=5, i_chi_rho=6, i_chi_t=7, &'''
new = '''                n_vars=10, i_p=1, i_e=2, i_s=3, i_dedrho=4, i_cv=5, i_chi_rho=6, i_chi_t=6, &'''

[[mutation]]
id = 'derivatives-05'
check = "derivatives: OPAL 2001's first, against finite differences (3e-3)"
file = 'eos/opal_eos_tables.f90'
