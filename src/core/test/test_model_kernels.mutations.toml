# Mutations of test_model_kernels: each check must print FAIL under a
# mutation of the kernel it covers (find_shell_boundaries, rescaling_kernels, mesh_spacing,
# compute_envelope_mixture, and step/convection_geometry's
# mixed_base_mass and mixed_base_fraction). Run, after `make tests` in src/: python3 src/tools/mutate.py core --program
# test_model_kernels (src/tools/mutate.py describes this format and the
# verdicts).
program = "test_model_kernels"
timeout = 60

[[mutation]]
id = 'shell_boundaries-01'
check = 'find_shell_boundaries: radiative model: core_edge 1, envelope_edge n'
file = 'core/model/shell_boundaries.f90'
old = '''
      else
         envelope_edge = num_points
'''
new = '''
      else
         envelope_edge = num_points - 1
'''

[[mutation]]
id = 'shell_boundaries-02'
check = 'find_shell_boundaries: convective core of 10 points: core_edge 10'
file = 'core/model/shell_boundaries.f90'
old = 'core_edge = i - 1'
new = 'core_edge = i'

[[mutation]]
id = 'shell_boundaries-03'
check = 'find_shell_boundaries: surface convection zone from 31: envelope_edge 31'
file = 'core/model/shell_boundaries.f90'
old = 'envelope_edge = i + 1'
new = 'envelope_edge = i'

[[mutation]]
id = 'shell_boundaries-04'
check = 'find_shell_boundaries: fully convective: envelope_edge 1, core_edge 1'
file = 'core/model/shell_boundaries.f90'
old = 'if (envelope_edge == 1) core_edge = 1'
new = 'if (envelope_edge == 0) core_edge = 1'

[[mutation]]
id = 'shell_boundaries-05'
check = 'find_shell_boundaries: central X above x_core_min: no H shell'
file = 'core/model/shell_boundaries.f90'
old = 'if (h1(1) <= x_core_min) then'
new = 'if (h1(1) <= 10.0_dp*x_core_min) then'

[[mutation]]
id = 'shell_boundaries-06'
check = 'find_shell_boundaries: H shell begins past the last X <= x_core_min (11)'
file = 'core/model/shell_boundaries.f90'
old = 'shell_begin = shell_begin + 1'
new = 'shell_begin = shell_begin + 2'

[[mutation]]
id = 'shell_boundaries-07'
check = 'find_shell_boundaries: H shell middle past the last X <= X_surf/2 (17)'
file = 'core/model/shell_boundaries.f90'
old = 'half_surface_x = 0.5_dp*h1(num_points)'
new = 'half_surface_x = 0.4_dp*h1(num_points)'

[[mutation]]
id = 'shell_boundaries-08'
check = 'find_shell_boundaries: H shell ends where the L step < 1e-5 L(n) (21)'
file = 'core/model/shell_boundaries.f90'
old = 'luminosity_change_tol = 1.0e-5_dp'
new = 'luminosity_change_tol = 1.0e-1_dp'

[[mutation]]
id = 'shell_boundaries-09'
check = 'find_shell_boundaries: H shell ends where X is within 1e-5 of X_surf (30)'
file = 'core/model/shell_boundaries.f90'
old = 'hydrogen_surface_tol = 1.0e-5_dp'
new = 'hydrogen_surface_tol = 1.0e-3_dp'

[[mutation]]
id = 'envelope_mixture-01'
check = 'compute_envelope_mixture: Y = 1 - X - Z - X(He3)'
file = 'core/model/rescaling_kernels.f90'
old = 'y_env = 1.0d0 - x_env - z_env - he3_env'
new = 'y_env = 1.0d0 - x_env - z_env'

[[mutation]]
id = 'envelope_mixture-02'
check = 'compute_envelope_mixture: the number fractions sum to 1'
file = 'core/model/rescaling_kernels.f90'
old = 'number_fractions(i) = weights(i)*scale_factor'
new = 'number_fractions(i) = weights(i)*scale_factor*1.001d0'

[[mutation]]
id = 'envelope_mixture-03'
check = 'compute_envelope_mixture: X(H) and X(He) = 1 - X - Z back'
file = 'core/model/rescaling_kernels.f90'
old = 'weights(ix_he) = (1.0d0-x_env-z_env)/scale_factor'
new = 'weights(ix_he) = (1.0d0-x_env-z_env-he3_env)/scale_factor'

[[mutation]]
id = 'envelope_mixture-04'
check = 'compute_envelope_mixture: each metal Z w_i/S back'
file = 'core/model/rescaling_kernels.f90'
old = '''           weights(ix_ar)+weights(ix_ne)
      metals_no_cno'''
new = '''           weights(ix_ar)
      metals_no_cno'''

[[mutation]]
id = 'envelope_mixture-05'
check = 'compute_envelope_mixture: 1/mu_ion = sum X_i/A_i'
file = 'core/model/rescaling_kernels.f90'
old = 'inverse_atomic_weight = weight_sum'
new = 'inverse_atomic_weight = weight_sum*1.001d0'

[[mutation]]
id = 'envelope_mixture-06'
check = 'compute_envelope_mixture: Z without C, N, O = Z (S-wC-wN-wO)/S'
file = 'core/model/rescaling_kernels.f90'
old = 'weights(ix_c)-weights(ix_o)-'
new = 'weights(ix_c)-'

[[mutation]]
id = 'mixed_base-01'
check = 'mixed_base_mass: the region holds sum dm(k..n) + f (m(k) - m(k-1))'
file = 'core/step/convection_geometry.f90'
old = '''
      if (base_zone > 1 .and. base_zone < num_zones) base_mass = base_mass - &'''
new = '''
      if (base_zone > 1 .and. base_zone < num_zones) base_mass = base_mass + &'''

[[mutation]]
id = 'mixed_base-02'
check = 'mixed_base_fraction: a base a zone away clips to 0.5, -0.5'
file = 'core/step/convection_geometry.f90'
old = 'base_frac = min(0.5d0, max(-0.5d0, base_frac))'
new = 'base_frac = min(1.5d0, max(-1.5d0, base_frac))'

[[mutation]]
id = 'mixed_base-03'
check = 'mixed_base_fraction: 0 with no base, at zone 1 or zone n'
file = 'core/step/convection_geometry.f90'
old = 'if (base_mass <= 0.0d0 .or. base_zone <= 1 .or. base_zone >= num_zones) return'
new = 'if (base_zone <= 1 .or. base_zone >= num_zones) return'

[[mutation]]
id = 'mixed_base-04'
check = 'mixed_base_fraction: f back from the base mass (0.3, -0.2)'
file = 'core/step/convection_geometry.f90'
old = '''
           num_zones) - base_mass)/(mass_coordinate(base_zone) - mass_coordinate(base_zone-1))'''
new = '''
           num_zones) - base_mass)/(mass_coordinate(base_zone+1) - mass_coordinate(base_zone-1))'''

# rescaling_kernels: the arithmetic of rescale_model.
[[mutation]]
id = 'rescaling_kernels-01'
check = 'hb_region_masses: core, shell and envelope add up to M'
file = 'core/model/rescaling_kernels.f90'
old = 'masses%core = exp(ln10*log_mass(shell_begin-1))/solar_mass'
new = 'masses%core = exp(ln10*log_mass(shell_begin))/solar_mass'

[[mutation]]
id = 'rescaling_kernels-02'
check = 'stretch_masses_above: the new total mass, the base and below unmoved'
file = 'core/model/rescaling_kernels.f90'
old = 'log_total_mass = log10(base_mass+stretch_factor*(exp10(log_total_mass)-base_mass))'
new = 'log_total_mass = log10(stretch_factor*(exp10(log_total_mass)-base_mass))'

[[mutation]]
id = 'rescaling_kernels-03'
check = 'stretch_masses_above: every point above moves by (M_new - m_b)/(M_old - m_b)'
file = 'core/model/rescaling_kernels.f90'
old = 'mass_stretch_factor = (new_total_msun-exp(ln10*log_base_mass)/solar_mass)/ &'
new = 'mass_stretch_factor = (new_total_msun+exp(ln10*log_base_mass)/solar_mass)/ &'

[[mutation]]
id = 'rescaling_kernels-04'
check = 'move_core_mass: the new core mass, its points scaled alike'
file = 'core/model/rescaling_kernels.f90'
old = 'log_mass_shift = log10(new_core_msun/old_core_msun)'
new = 'log_mass_shift = log10(old_core_msun/new_core_msun)'

[[mutation]]
id = 'rescaling_kernels-05'
check = 'move_core_mass: the shell keeps its mass'
file = 'core/model/rescaling_kernels.f90'
old = 'mass_shift_grams = (new_core_msun - old_core_msun)*solar_mass'
new = 'mass_shift_grams = 0.5d0*(new_core_msun - old_core_msun)*solar_mass'

[[mutation]]
id = 'rescaling_kernels-06'
check = 'move_core_mass: the outer point stays, the envelope shrinks toward it'
file = 'core/model/rescaling_kernels.f90'
old = 'mass_scale_factor = (exp(ln10*log_mass(nz))-exp(ln10*log_mass(shell_end)))/ &'
new = 'mass_scale_factor = (exp(ln10*log_mass(nz))+exp(ln10*log_mass(shell_end)))/ &'

[[mutation]]
id = 'rescaling_kernels-07'
check = 'scale_hydrogen: X_i X_new/X_surf, the surface at X_new'
file = 'core/model/rescaling_kernels.f90'
old = 'x_rescale_factor = new_surface_x/max(old_surface_x, x_floor)'
new = 'x_rescale_factor = old_surface_x/max(new_surface_x, x_floor)'

[[mutation]]
id = 'rescaling_kernels-08'
check = 'scale_hydrogen: no shell above X_new'
file = 'core/model/rescaling_kernels.f90'
old = 'hydrogen(zone_idx) = min(new_surface_x, hydrogen(zone_idx)*x_rescale_factor)'
new = 'hydrogen(zone_idx) = max(new_surface_x, hydrogen(zone_idx)*x_rescale_factor)'

[[mutation]]
id = 'rescaling_kernels-09'
check = 'shift_metals: Z + dZ, not below 0; CNO by Z_new/Z_old; the rest kept'
file = 'core/model/rescaling_kernels.f90'
old = '''
         xa(i_metals,zone_idx) = max(0.0d0, xa(i_metals,zone_idx)+delta_z)
         do species_idx = i_c12, i_o18
'''
new = '''
         xa(i_metals,zone_idx) = max(0.0d0, xa(i_metals,zone_idx)+delta_z)
         do species_idx = i_c12, i_o18 - 1
'''

[[mutation]]
id = 'rescaling_kernels-10'
check = 'set_helium_by_difference: X + Y + Z + X(He3) = 1'
file = 'core/model/rescaling_kernels.f90'
old = 'xa(i_he4,zone_idx) = 1.0d0-xa(i_h1,zone_idx)-xa(i_metals,zone_idx)- &'
new = 'xa(i_he4,zone_idx) = 1.0d0-xa(i_h1,zone_idx)+xa(i_metals,zone_idx)- &'

[[mutation]]
id = 'rescaling_kernels-11'
check = 'ramp_metals: the core value, the ramp, the surface kept; X = 1 - Y - Z - He3'
file = 'core/model/rescaling_kernels.f90'
old = 'z_ramp_value = (mass_fraction_local-inner_q)*z_ramp_slope+core_z'
new = 'z_ramp_value = (mass_fraction_local-inner_q)*z_ramp_slope-core_z'

# mesh_spacing: the rezone's new mesh.
[[mutation]]
id = 'mesh_spacing-01'
check = 'accumulate_chi: chi(1) = 1; the log m and L terms where L rises'
file = 'core/model/mesh_spacing.f90'
old = '(luminosity(j)-luminosity(j-1))/scales%luminosity - &'
new = '(luminosity(j)-luminosity(j-1))*scales%luminosity - &'

[[mutation]]
id = 'mesh_spacing-02'
check = 'accumulate_chi: the log P term below, inside and above the fine zone'
file = 'core/model/mesh_spacing.f90'
old = 'if (abs(pressure_test) < scales%base_fine_width) then'
new = 'if (pressure_test < scales%base_fine_width) then'

[[mutation]]
id = 'mesh_spacing-03'
check = 'sort_kept_points: ascending, a duplicate removed'
file = 'core/model/mesh_spacing.f90'
old = 'if (flag_point(i+1) < flag_point(i)) then'
new = 'if (flag_point(i+1) > flag_point(i)) then'

# The scan staying at a slot it has just filled, which removes every
# duplicate: the check holds today's result and fails with it.
[[mutation]]
id = 'mesh_spacing-04'
check = 'sort_kept_points: of three equal points two are left'
file = 'core/model/mesh_spacing.f90'
old = '''
            flag_count = flag_count - 1
         end if
'''
new = '''
            flag_count = flag_count - 1
            i = i - 1
         end if
'''

[[mutation]]
id = 'mesh_spacing-05'
check = 'space_points_along_chi: int(Delta chi) + 1 even intervals a segment'
file = 'core/model/mesh_spacing.f90'
old = 'segment_point_count = int(delta_chi)+1'
new = 'segment_point_count = int(delta_chi)+2'

[[mutation]]
id = 'mesh_spacing-06'
check = 'space_points_along_chi: the first and the kept points are on the mesh'
file = 'core/model/mesh_spacing.f90'
old = 'new_log_mass(1) = log_mass(1)'
new = 'new_log_mass(1) = log_mass(2)'

[[mutation]]
id = 'mesh_spacing-07'
check = 'space_points_along_chi: the count needed when the arrays are too small'
file = 'core/model/mesh_spacing.f90'
old = 'needed_points = new_num_zones+segment_point_count'
new = 'needed_points = segment_point_count'

[[mutation]]
id = 'mesh_spacing-08'
check = 'spline_onto_points: a profile linear in log m is reproduced'
file = 'core/model/mesh_spacing.f90'
old = 'values(1) = profile(1)'
new = 'values(1) = profile(2)'

[[mutation]]
id = 'mesh_spacing-09'
check = 'insert_points_at_jumps: int(step/max) points, evenly in log m'
file = 'core/model/mesh_spacing.f90'
old = 'dble(num_new_points+1)'
new = 'dble(num_new_points)'

[[mutation]]
id = 'mesh_spacing-10'
check = 'insert_points_at_jumps: a fall counts with falling only'
file = 'core/model/mesh_spacing.f90'
old = 'outward_step = values(j-1) - values(j)'
new = 'outward_step = values(j) - values(j-1)'

[[mutation]]
id = 'mesh_spacing-11'
check = 'insert_points_at_jumps: none with the limit off; the count needed'
file = 'core/model/mesh_spacing.f90'
old = 'needed_points = working_num_zones+num_new_points'
new = 'needed_points = num_new_points'

[[mutation]]
id = 'mesh_spacing-12'
check = 'remove_crowded_points: within the limit of the last kept; the ends stay'
file = 'core/model/mesh_spacing.f90'
old = 'if (new_log_mass(k) - new_log_mass(j) > min_spacing) then'
new = 'if (new_log_mass(k) - new_log_mass(j) > 0.0d0) then'
