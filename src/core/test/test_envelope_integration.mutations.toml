# Mutations of test_envelope_integration: each check must print FAIL under
# a mutation of the code it covers (core/README.md, the tests). Run, after
# `make tests` in src/: python3 src/tools/mutate.py core --program
# test_envelope_integration (src/tools/mutate.py describes this format and
# the verdicts). The program reads the TAMS deck of test_structure.
# One check has no mutation: "gray photosphere: the star's atmosphere
# untouched". gray_photosphere takes the star intent(in), so a mutant
# that writes the star does not compile; the check stands for a change
# of that intent.
program = "test_envelope_integration"
timeout = 120
args = ["{repo}/src/core/test/test_structure_tams.inlist"]

[env]
YREC_OUTPUT = "output"

[[mutation]]
id = 'envelope-01'
check = 'atmosphere: dlog P/dlog tau = g tau/(kappa P)'
file = 'core/envelope/envelope_integrands.f90'
old = 'dydx(1) = effective_gravity*optical_depth/ &'
new = 'dydx(1) = effective_gravity*sqrt(optical_depth)/ &'

[[mutation]]
id = 'envelope-02'
check = 'atmosphere: T^4 = (3/4) Teff^4 (tau + 2/3)'
file = 'core/envelope/envelope_integrands.f90'
old = 'log10_temperature = ttau_log10_temperature(optical_depth, &'
new = 'log10_temperature = ttau_log10_temperature(2.0d0*optical_depth, &'

[[mutation]]
id = 'envelope-03'
check = 'envelope: dlog m/dlog P = -4 pi r^4 P/(G m^2)'
file = 'core/envelope/envelope_integrands.f90'
old = 'c4pil+4.0d0*log10_radius'
new = 'c4pil+3.0d0*log10_radius'

[[mutation]]
id = 'envelope-04'
check = 'envelope: dlog r/dlog P = -r P/(G m rho)'
file = 'core/envelope/envelope_integrands.f90'
old = 'dydx(3) = -exp(ln10*(log10_pressure+log10_radius-'
new = 'dydx(3) = -exp(ln10*(log10_pressure+2.0d0*log10_radius-'

[[mutation]]
id = 'envelope-05'
check = 'envelope: dlog T/dlog P = grad'
file = 'core/envelope/envelope_integrands.f90'
old = 'dydx(2) = actual_gradient'
new = 'dydx(2) = 0.9d0*actual_gradient'

[[mutation]]
id = 'envelope-06'
check = 'ierr = 0'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'integer, parameter :: max_steps = 2000'
new = 'integer, parameter :: max_steps = 20'

[[mutation]]
id = 'envelope-07'
check = 'events: atmosphere done, vertex, envelope done'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'call add_envint_event(events, envint_envelope_done, &'
new = 'call add_envint_event(events, envint_atmosphere_done, &'

[[mutation]]
id = 'envelope-08'
check = 'not switched to gray'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'switched_to_gray = .false.'
new = 'switched_to_gray = .true.'

[[mutation]]
id = 'envelope-09'
check = 'photosphere at tau = 2/3'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'st%log10_tau_photosphere = ttau_photosphere_x_limit(st%eqs%atm_choice)'
new = 'st%log10_tau_photosphere = ttau_photosphere_x_limit(st%eqs%atm_choice) + 0.01d0'

[[mutation]]
id = 'envelope-10'
check = 'T = Teff at the photosphere'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'st%log10_tau_photosphere = ttau_photosphere_x_limit(st%eqs%atm_choice)'
new = 'st%log10_tau_photosphere = ttau_photosphere_x_limit(st%eqs%atm_choice) + 0.01d0'

[[mutation]]
id = 'envelope-11'
check = "photospheric P = the last atmosphere point's"
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'log10_photo_pressure = st%eqs%atm_point%log10_pressure'
new = 'log10_photo_pressure = st%eqs%atm_point%log10_temperature'

[[mutation]]
id = 'envelope-12'
check = 'envelope ends at the fitting mass'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'if (abs(st%mass_left) <= st%end_tolerance) then'
new = 'if (abs(st%mass_left) <= 1.0d3*st%end_tolerance) then'

[[mutation]]
id = 'envelope-13'
check = 'the vertex event holds the vertex'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'values=[vertex%log10_pressure, vertex%log10_temperature, &'
new = 'values=[vertex%log10_temperature, vertex%log10_pressure, &'

[[mutation]]
id = 'envelope-14'
check = 'atmosphere steps = RK4 (log P)'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '''
      end do
      call st%eqs%derivatives(st%x, st%y, st%dydx, ierr)'''
new = '''
      end do
      call st%eqs%derivatives(st%x+1.0d-3, st%y, st%dydx, ierr)'''

[[mutation]]
id = 'envelope-15'
check = 'envelope steps = RK4 (log m, log T, log r)'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '''
      end do
      call st%eqs%derivatives(st%x, st%y, st%dydx, ierr)'''
new = '''
      end do
      call st%eqs%derivatives(st%x+1.0d-3, st%y, st%dydx, ierr)'''

[[mutation]]
id = 'envelope-16'
check = 'vertex = interpolation to the fitting mass'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'vertex%log10_pressure = st%x + weight*(st%x_start - st%x)'
new = 'vertex%log10_pressure = st%x_start + weight*(st%x_start - st%x)'

[[mutation]]
id = 'envelope-17'
check = 'thin: ierr = 0, no envelope points'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'if (cfg%log_fit_point_mass_fraction > max_log_fit_point_mass_fraction) then'
new = 'if (cfg%log_fit_point_mass_fraction > 0.0d0) then'

[[mutation]]
id = 'envelope-18'
check = 'thin: vertex = the surface point'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '''
            vertex%log10_radius = log10_radius
'''
new = '''
            vertex%log10_radius = log10_radius + 1.0d-9
'''

[[mutation]]
id = 'envelope-19'
check = 'retry: an envint_start_retry event first'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'call add_envint_event(events, envint_start_retry, &'
new = 'call add_envint_event(events, envint_atmosphere_done, &'

[[mutation]]
id = 'envelope-20'
check = 'retry: its start lies past the photosphere'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'values=[st%x, st%log10_tau_photosphere])'
new = 'values=[st%log10_tau_photosphere, st%x])'

[[mutation]]
id = 'envelope-21'
check = 'retry: then the integration succeeds'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'start_density = start_density/start_density_divisor'
new = 'start_density = start_density/1.0d0'

[[mutation]]
id = 'envelope-22'
check = 'atmosphere maxstp: ierr = 1, its event last'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'call add_envint_event(events, envint_atmosphere_maxstp, counts=[max_steps, 0])'
new = 'continue'

[[mutation]]
id = 'envelope-23'
check = 'atmosphere maxstp: no photospheric pressure'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'log10_photo_pressure = no_photosphere_log10_pressure'
new = 'log10_photo_pressure = 0.0d0'

[[mutation]]
id = 'envelope-24'
check = 'envelope maxstp: ierr = 1, its event last'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'call add_envint_event(events, envint_envelope_maxstp, counts=[max_steps, 0])'
new = 'call add_envint_event(events, envint_atmosphere_maxstp, counts=[max_steps, 0])'

[[mutation]]
id = 'envelope-25'
check = 'envelope maxstp: the photosphere was reached'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'log10_photo_pressure = st%eqs%atm_point%log10_pressure'
new = 'log10_photo_pressure = st%eqs%atm_point%log10_temperature'

[[mutation]]
id = 'envelope-26'
check = 'bsstep limits: ierr = numerics_bad_input'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '''
              counts=[cfg%max_stage_index, cfg%extrap_order])
         ierr = bs_status
      else if (bs_status == numerics_derivatives_failed) then'''
new = '''
              counts=[cfg%max_stage_index, cfg%extrap_order])
         ierr = 1
      else if (bs_status == numerics_derivatives_failed) then'''

[[mutation]]
id = 'envelope-27'
check = 'bsstep limits: the event holds imax, nuse'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '''
         call add_envint_event(events, envint_bsstep_limits, &
              counts=[cfg%max_stage_index, cfg%extrap_order])'''
new = '''
         call add_envint_event(events, envint_bsstep_limits, &
              counts=[cfg%extrap_order, cfg%max_stage_index])'''

[[mutation]]
id = 'envelope-28'
check = 'step underflow: ierr = envelope_termination'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '''
              values=[st%x, real(st%num_eqs, dp)])
         ierr = envelope_termination'''
new = '''
              values=[st%x, real(st%num_eqs, dp)])
         ierr = 1'''

[[mutation]]
id = 'envelope-29'
check = "step underflow: the event holds bsstep's status"
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'call add_envint_event(events, envint_bsstep_failed, counts=[bs_status, 0], &'
new = 'call add_envint_event(events, envint_bsstep_failed, counts=[0, 0], &'

[[mutation]]
id = 'envint-derivs-01'
check = 'derivatives failure in a step: ierr > 0 (an error)'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'ierr = derivatives_status'
new = 'ierr = envelope_termination'

[[mutation]]
id = 'envint-derivs-02'
check = 'derivatives failure in a step: the event holds the code'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'counts=[bs_status, derivatives_status], &'
new = 'counts=[bs_status], &'

[[mutation]]
id = 'envelope-gray-01'
check = 'gray photosphere: log P = the kernel'
file = 'core/envelope/envelope_integration.f90'
old = 'no_distortion = 1.0_dp'
new = 'no_distortion = 0.5_dp'

[[mutation]]
id = 'envelope-depth-01'
check = 'depth: the first step is measured from tau = 0'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '      st%prev_tau = 0.0d0'
new = '      st%prev_tau = 1.0d0'

[[mutation]]
id = 'envelope-depth-02'
check = 'depth: each step is dtau over the mean rho kappa'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'st%prev_density = pt%density'
new = 'st%prev_density = 2.0d0*pt%density'

[[mutation]]
id = 'envelope-cap-01'
check = 'retry: no start before the photosphere: ierr = 1'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'if (try == max_start_tries) exit'
new = 'if (try == max_start_tries) return'

[[mutation]]
id = 'envelope-cap-02'
check = 'retry: it stops after max_start_tries densities'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'call add_envint_event(events, envint_start_exhausted, counts=[max_start_tries, 0], &'
new = 'call add_envint_event(events, envint_start_exhausted, counts=[max_start_tries-1, 0], &'

[[mutation]]
id = 'envelope-table-01'
check = 'table: ierr = 0; no atmosphere points, no atmosphere event'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '         st%tabulated_surface = .true.'
new = '         st%tabulated_surface = .false.'

[[mutation]]
id = 'envelope-table-02'
check = "table: the surface point is the table's"
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'call atm_get_surface_pt(st%eqs%atm_choice, st%eqs%log10_teff, &'
new = 'call atm_get_surface_pt(st%eqs%atm_choice, st%eqs%log10_teff+0.01d0, &'

[[mutation]]
id = 'envelope-table-03'
check = 'table: the envelope starts at the surface point'
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'st%y(2) = st%eqs%atm_point%log10_temperature'
new = 'st%y(2) = st%eqs%atm_point%log10_temperature + 1.0d-6'

[[mutation]]
id = 'envelope-fallback-01'
check = 'fallback: above the table: switched to gray, ierr = 0'
file = 'core/envelope/envelope_integration_kernel.f90'
old = '         switched_to_gray = .true.'
new = '         switched_to_gray = .false.'

[[mutation]]
id = 'envelope-fallback-02'
check = "fallback: the integration is the gray atmosphere's"
file = 'core/envelope/envelope_integration_kernel.f90'
old = 'st%eqs%atm_choice = atm_eddington_gray'
new = 'st%eqs%atm_choice = 1'

[[mutation]]
id = 'envelope-driver-01'
check = "atm_get: on the table: photosphere_logP the table's"
file = 'core/envelope/envelope_integration.f90'
old = 's%photosphere_logP = log10_photo_pressure'
new = 's%photosphere_logP = 0.0d0'

[[mutation]]
id = 'envelope-driver-02'
check = 'atm_get: above the table: the choice in use is gray'
file = 'core/envelope/envelope_integration.f90'
old = 'if (switched_to_gray) s%atm_choice_in_use = atm_eddington_gray'
new = 'if (.false.) s%atm_choice_in_use = atm_eddington_gray'

[[mutation]]
id = 'envelope-gray-02'
check = 'gray photosphere: ierr = 0'
file = 'core/envelope/envelope_integration.f90'
old = 'cfg%atm_choice = atm_eddington_gray'
new = 'cfg%atm_choice = 3'

[[mutation]]
id = 'envelope-gray-03'
check = 'gray photosphere: T = Teff'
file = 'core/envelope/envelope_integration.f90'
old = 'log10_temperature = atm_point%log10_temperature'
new = 'log10_temperature = atm_point%log10_pressure'
