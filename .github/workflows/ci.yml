# CI for the YREC modernization (added 2026, phase four).
#
# Scope: full build + the per-module test suite (phase-three stage 2):
#   - boundary checker (no data needed)
#   - standalone eos/kap/atm table tests (need ~17 MB of input tables,
#     pulled via sparse checkout so CI never downloads the full 3.1 GB
#     input/ tree)
#
# Deliberately NOT here (yet): the Stage-0 full-model byte-identical
# regression -- its reference outputs (examples/*/standard/) are
# largely untracked (gitignored), so it remains a local/manual gate.
# If the standalone numeric baselines (pinned on macOS/arm64) prove
# platform-sensitive on the Linux runners' last printed digit, the
# right fix is per-platform baselines or a ULP-tolerant comparator --
# not loosening the local byte-exact discipline.
name: CI

on:
  push:
    branches: [modernize-readable-refactor, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /conftest.py
            /test_eos.py
            /test_net.py
            /test_kap.py
            /test_atm.py
            /test_boundaries.py
            /input/eos/yale/FERMI.TAB
            /input/eos/scv/
            /input/eos/opal2006/EOSOPAL06Z0.016492
            /input/opacity/atomic/legacy/opal95/GS98.OP17
            /input/atmos/kurucz/atmk1990p00.tab
            /input/atmos/CastelliKurucz/atmk2004p00.tab
            /input/atmos/allard/Nextgen2.all

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip pytest

      - name: Build yrec
        run: make -C src -j4

      - name: Build standalone test programs
        run: make -C src -j4 test_eos test_kap test_atm test_net
      - name: Build libyrec (shared)
        run: make -C src lib
      - name: Library-based link check (archives complete, layout self-consistent)
        run: make -C src -j4 libs && make -C src yrec_libs

      - name: Run per-module tests and boundary checker
        env:
          YREC_TEST_TOLERANT: "1"
        run: python3 -m pytest test_eos.py test_kap.py test_atm.py test_net.py test_boundaries.py -v

  # Stage-0 solar regression (2026, test-depth item): runs the standard
  # solar case TWICE in-job -- the first run seeds the reference, the
  # second must reproduce it byte-for-byte (minus the git-hash banner).
  # This tests determinism + full-model wiring on Linux without
  # committing the platform-sensitive local baselines, exactly as the
  # scope note at the top of this file prescribes. Plus the
  # loose-tolerance physics assertions (test_physics.py), the error-path
  # contract (test_error_exit.py), and the generated-deps freshness
  # check.
  solar-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /conftest.py
            /pytest.ini
            /test_physics.py
            /test_error_exit.py
            /examples/run_standard_solar_model/
            /startmodels/dbl/m1000gs98z018804_Dbl.first
            /input/eos/yale/FERMI.TAB
            /input/eos/scv/
            /input/eos/opal2006/EOSOPAL06Z0.016492
            /input/opacity/atomic/legacy/opal95/GS98.OP17
            /input/opacity/atomic/lanl/PURECO.DBGLAOL
            /input/opacity/molecular/alex06/alexmol06gs98.tab
            /input/opacity/conductive/potekhin/condall06.d
            /input/atmos/kurucz/atmk1990p00.tab
            /input/atmos/allard/Nextgen2.all

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip pytest

      - name: Generated dependencies are fresh
        run: python3 src/tools/gen_makefile_deps.py --check

      - name: Generated default column selections are fresh
        run: python3 src/tools/gen_default_columns.py --check

      - name: Build yrec
        run: make -C src -j4

      - name: Solar case runs deterministically (two runs, byte-compare)
        env:
          YREC_INPUT: ${{ github.workspace }}/input
          YREC_START: ${{ github.workspace }}/startmodels
        run: |
          cd examples/run_standard_solar_model
          mkdir -p output run1 run2
          ../../src/yrec Test_solar_noGS_norot.nml1 Test_solar_noGS_norot.nml2
          cp -r output/. run1/
          rm -rf output && mkdir output
          ../../src/yrec Test_solar_noGS_norot.nml1 Test_solar_noGS_norot.nml2
          cp -r output/. run2/
          for f in run1/*; do
            b=$(basename "$f")
            if [ "$b" = "Test_solar_noGS_norot.log" ]; then
              diff <(grep -v '^# YREC v' "run1/$b") <(grep -v '^# YREC v' "run2/$b")
            else
              cmp "run1/$b" "run2/$b"
            fi
          done

      - name: Physics + error-path assertions
        run: python3 -m pytest test_physics.py test_error_exit.py -v
