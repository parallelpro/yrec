# CI for YREC.
#
# Three jobs, each from a sparse checkout (the repository's input/ tree is
# 3.1 GB; CI fetches only the tables the tests read, about 50 MB, and the
# starting models the decks name):
#   build-and-test    the six generators' --check, the build, `make tests`,
#                     the other-energy example and the library link checks,
#                     then pytest on every unit-test file and on the deck
#                     tests that need only the solar deck's tables.
#   devel-tests       the unit test programs built with the development
#                     flags (`make devel_tests`: -fcheck=all
#                     -ffpe-trap=invalid,zero,overflow), each run by
#                     src/tools/devel_tests.py: it must exit 0 with no
#                     runtime error and no FAIL line. Nothing is
#                     byte-compared (the flags move round-off). The cases
#                     that fail today are skipped by name in the tool's
#                     KNOWN_FAILURES, each with its defect.
#   solar-regression  the standard solar case run twice in one job and the
#                     two runs byte-compared (determinism on Linux).
#
# Not here, and why: test_mesa_baselines.py and the examples' standard/
# pins are byte pins made on macOS/arm64 (untracked), and test_all.py
# runs every example deck, which needs the full input/ tree; both stay
# local gates. The standalone tests' printed baselines are also pinned on
# macOS/arm64: YREC_TEST_TOLERANT=1 lets their numbers differ by 1e-9
# relative (conftest.py), and a difference beyond that needs per-platform
# baselines, not a looser local check. The exceptions are numbers whose
# low digits are round-off of an order-one quantity: residuals, finite
# differences' errors, and small changes of X or j. Each test compares
# those to an absolute bound it states and measured (abs_floor and
# abs_tol in conftest.py: test_rotation.py, test_structure.py,
# test_mass_change.py, test_regrid.py, test_henyey_elimination.py,
# test_envelope_integration.py, test_timestep_limits.py).
#
# The test list and the sparse checkout below were derived by tracing
# which files each test opens (2026-10-31; test_monte_carlo.py, added
# 2026-11-01, runs cm_monte_carlo twice in a scratch directory and reads
# that deck, mc_input.dat, startmodels/dbl/ and the tables listed for the
# configuration-matrix decks); a test that starts reading another table
# needs its line here, in build-and-test's list and devel-tests' (the
# same list).
name: CI

on:
  push:
    branches: [main, yrec-next, modernize-readable-refactor]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /pyyrec/
            /conftest.py
            /pytest.ini
            /test_*.py
            /examples/**/*.inlist
            /examples/**/*.nml1
            /examples/**/*.nml2
            /examples/run_config_matrix/mc_input.dat
            /examples/other_energy/
            /testsuite/
            /startmodels/dbl/
            /startmodels/seed/
            /startmodels/start/
            /startmodels/tams/
            /startmodels/zahb/
            /startmodels/dbl_grid/m3000gs98z016492_Dbl.first
            /input/eos/yale/FERMI.TAB
            /input/eos/scv/h_tab_i.dat
            /input/eos/scv/he_tab_i.dat
            /input/eos/scv/z_tab_i.dat
            /input/eos/opal2006/EOSOPAL06Z0.016492
            /input/eos/opal2006/EOSOPAL06Z0.018776
            /input/eos/legacy/opal/OPALeos.0188
            /input/eos/legacy/opal2001/O01EOS0188z
            /input/opacity/atomic/lanl/PURECO.DBGLAOL
            /input/opacity/atomic/legacy/opal92/Z0188AG89.DBGLAOL
            /input/opacity/atomic/legacy/opal92/Z0190AG91.DBGLAOL
            /input/opacity/atomic/legacy/opal92/Z0188.OPALN
            /input/opacity/atomic/legacy/opal92/Z0200.OPALN
            /input/opacity/atomic/legacy/opal95/GS98.OP17
            /input/opacity/atomic/op05/GS98.OP17
            /input/opacity/conductive/potekhin/condall06.d
            /input/opacity/molecular/alex06/alexmol06gs98.tab
            /input/opacity/molecular/alexmol06gs98.tab
            /input/opacity/molecular/legacy/alex/
            /input/opacity/molecular/legacy/kurmol/kapm05.ross
            /input/opacity/molecular/legacy/kurmol/kapp00.ross
            /input/atmos/kurucz/atmk1990p00.tab
            /input/atmos/CastelliKurucz/atmk2004p00.tab
            /input/atmos/allard/Nextgen.p00
            /input/atmos/allard/Nextgen2.all

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python3 -m pip install --upgrade pip pytest

      - name: Generated files are current (the six generators' --check)
        working-directory: src
        run: |
          for g in gen_makefile_deps gen_default_columns gen_controls_state \
                   gen_inlist gen_controls_dump gen_star_docs; do
            python3 tools/$g.py --check
          done

      - name: Build yrec
        run: make -C src -j4

      - name: Build the test programs
        run: make -C src -j4 tests

      - name: Build the extra-energy-source example (examples/other_energy)
        run: make -C src -j4 other_energy

      - name: Build libyrec (shared)
        run: make -C src lib

      - name: Library-based link check (archives complete, layout self-consistent)
        run: make -C src -j4 libs && make -C src yrec_libs

      # the decks write into their own output/ directories (untracked, so
      # a fresh checkout has none); cm_monte_carlo's Monte Carlo files are
      # named relative to its deck, and test_controls opens them
      - name: Make the decks' output directories
        run: mkdir -p examples/run_config_matrix/output

      - name: Run the unit tests and the solar-deck tests
        env:
          YREC_TEST_TOLERANT: "1"
        run: >
          python3 -m pytest -v -rs
          test_numerics.py test_math.py test_io.py test_controls.py
          test_generated_files.py test_boundaries.py test_structure.py
          test_rotation.py test_rotation_kernels.py test_element_diffusion.py
          test_convection.py test_triangle_fit.py test_mass_change.py
          test_henyey_elimination.py test_envelope_integration.py
          test_timestep_limits.py
          test_regrid.py test_eos.py test_kap.py test_atm.py test_net.py
          test_other_energy.py test_error_exit.py test_reentry.py
          test_physics.py test_stop_conditions.py test_inlist_convert.py
          test_mesa_output.py test_pyyrec.py test_monte_carlo.py
          test_run_contracts.py test_model_kernels.py

  # The unit test programs under the development flags (the header above).
  devel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /pyyrec/
            /conftest.py
            /pytest.ini
            /test_*.py
            /examples/**/*.inlist
            /examples/**/*.nml1
            /examples/**/*.nml2
            /examples/run_config_matrix/mc_input.dat
            /examples/other_energy/
            /testsuite/
            /startmodels/dbl/
            /startmodels/seed/
            /startmodels/start/
            /startmodels/tams/
            /startmodels/zahb/
            /startmodels/dbl_grid/m3000gs98z016492_Dbl.first
            /input/eos/yale/FERMI.TAB
            /input/eos/scv/h_tab_i.dat
            /input/eos/scv/he_tab_i.dat
            /input/eos/scv/z_tab_i.dat
            /input/eos/opal2006/EOSOPAL06Z0.016492
            /input/eos/opal2006/EOSOPAL06Z0.018776
            /input/eos/legacy/opal/OPALeos.0188
            /input/eos/legacy/opal2001/O01EOS0188z
            /input/opacity/atomic/lanl/PURECO.DBGLAOL
            /input/opacity/atomic/legacy/opal92/Z0188AG89.DBGLAOL
            /input/opacity/atomic/legacy/opal92/Z0190AG91.DBGLAOL
            /input/opacity/atomic/legacy/opal92/Z0188.OPALN
            /input/opacity/atomic/legacy/opal92/Z0200.OPALN
            /input/opacity/atomic/legacy/opal95/GS98.OP17
            /input/opacity/atomic/op05/GS98.OP17
            /input/opacity/conductive/potekhin/condall06.d
            /input/opacity/molecular/alex06/alexmol06gs98.tab
            /input/opacity/molecular/alexmol06gs98.tab
            /input/opacity/molecular/legacy/alex/
            /input/opacity/molecular/legacy/kurmol/kapm05.ross
            /input/opacity/molecular/legacy/kurmol/kapp00.ross
            /input/atmos/kurucz/atmk1990p00.tab
            /input/atmos/CastelliKurucz/atmk2004p00.tab
            /input/atmos/allard/Nextgen.p00
            /input/atmos/allard/Nextgen2.all

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Build the test programs with the development flags
        run: make -C src -j4 devel_tests

      - name: Run them (exit 0, no runtime error, no FAIL line)
        run: python3 src/tools/devel_tests.py

  # The standard solar case run TWICE in one job: the first run is the
  # reference, the second must reproduce it byte for byte (minus the
  # version line). This checks determinism and the whole model's wiring
  # on Linux without the macOS-pinned baselines (the scope note above).
  solar-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /examples/run_standard_solar_model/
            /startmodels/dbl/m1000gs98z018804_Dbl.first
            /input/eos/yale/FERMI.TAB
            /input/eos/scv/h_tab_i.dat
            /input/eos/scv/he_tab_i.dat
            /input/eos/scv/z_tab_i.dat
            /input/eos/opal2006/EOSOPAL06Z0.016492
            /input/opacity/atomic/legacy/opal95/GS98.OP17
            /input/opacity/atomic/lanl/PURECO.DBGLAOL
            /input/opacity/molecular/alex06/alexmol06gs98.tab
            /input/opacity/conductive/potekhin/condall06.d

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Build yrec
        run: make -C src -j4

      - name: Solar case runs deterministically (two runs, byte-compare)
        env:
          YREC_INPUT: ${{ github.workspace }}/input
          YREC_START: ${{ github.workspace }}/startmodels
        run: |
          cd examples/run_standard_solar_model
          mkdir -p output run1 run2
          ../../src/yrec Test_solar_noGS_norot.nml1 Test_solar_noGS_norot.nml2
          cp -r output/. run1/
          rm -rf output && mkdir output
          ../../src/yrec Test_solar_noGS_norot.nml1 Test_solar_noGS_norot.nml2
          cp -r output/. run2/
          for f in run1/*; do
            b=$(basename "$f")
            if [ "$b" = "Test_solar_noGS_norot.log" ]; then
              diff <(grep -v '^# YREC v' "run1/$b") <(grep -v '^# YREC v' "run2/$b")
            else
              cmp "run1/$b" "run2/$b"
            fi
          done
